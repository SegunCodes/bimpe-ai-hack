# Optional local database (Postgres, same engine as Neon). Start with: docker compose up -d postgres
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: tellero
      POSTGRES_USER: tellero
      POSTGRES_PASSWORD: tellero-local-password
    ports:
      - "5432:5432"
    volumes:
      - tellero_pg_data:/var/lib/postgresql/data

volumes:
  tellero_pg_data:
